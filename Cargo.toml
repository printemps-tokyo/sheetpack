[package]
name = "sheetpack"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Pack sprites into texture atlases from the command line, built for CI: deterministic output, engine-ready manifests (TexturePacker-style JSON, Phaser 3 multiatlas, Godot 4 .tres, CSS) and a --check mode that fails the build when an atlas is stale."
authors = ["printemps.tokyo <develop@printemps.tokyo>"]
repository = "https://github.com/printemps-tokyo/sheetpack"
homepage = "https://github.com/printemps-tokyo/sheetpack"
readme = "README.md"
keywords = ["sprite", "atlas", "texture", "gamedev", "cli"]
categories = ["command-line-utilities", "game-development", "multimedia::images"]

[[bin]]
name = "sheetpack"
path = "src/main.rs"

[lib]
name = "sheetpack"
path = "src/lib.rs"

[dependencies]
# Error context for the thin binary layer (org convention).
anyhow = "1"
# Argument parsing (derive API, org convention).
clap = { version = "4", features = ["derive"] }
# Decoding inputs and encoding the atlas page. default-features are off so only
# the formats sprites actually arrive in are compiled in. Packing itself is
# plain rectangle arithmetic; no other dependency is involved.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }

[dev-dependencies]
# Scratch directories for the CLI integration tests.
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
